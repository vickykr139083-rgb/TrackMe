<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Money Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f2f4f8">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f2f4f8;--card:#fff;--tx:#1a2233;--mu:#6b7686;--bd:#e4e8ef;--pri:#ed1c24;--chip:#eef1f6;--ok:#16a34a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1220;--card:#171c2c;--tx:#eef1f8;--mu:#97a0b4;--bd:#262d42;--chip:#222a3f}}
:root[data-theme="dark"]{--bg:#0e1220;--card:#171c2c;--tx:#eef1f8;--mu:#97a0b4;--bd:#262d42;--chip:#222a3f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;background:var(--bg)}
body{height:100%;margin:0 auto;max-width:520px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:400 14px/1.35 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header{flex:none;display:flex;align-items:center;gap:12px;padding:12px 14px 2px}
body:not(.sub) header{display:none}
header b{display:block;font-size:18px;font-weight:700}header small{opacity:.85;font-size:12px}
.lg{width:38px;height:38px;border-radius:50%;background:#fff;color:#ed1c24;display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.bk{color:var(--tx);font-size:26px;padding:0 8px 0 0;line-height:1}
main{flex:1;min-height:0;padding:0 14px 10px;overflow-y:auto}
body.sub main{padding-top:12px}
main.home{overflow:hidden;display:flex;flex-direction:column}
.card{background:var(--card);border-radius:16px;padding:12px;box-shadow:0 1px 4px rgba(20,30,60,.08)}
.hc{margin-top:12px;flex:none}
.dn{display:block;margin:0 auto;padding:0}
.donut{display:block;width:min(28vh,220px);height:min(28vh,220px)}
.ct{font:700 25px Roboto,system-ui,sans-serif;fill:var(--tx);text-anchor:middle}
.pc{font:700 8px Roboto,system-ui,sans-serif;fill:#fff;text-anchor:middle}
.cs{font:400 10.5px Roboto,system-ui,sans-serif;fill:var(--mu);text-anchor:middle}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.leg button{display:flex;align-items:center;gap:8px;text-align:left;background:var(--chip);border-radius:11px;padding:7px 10px}
.dot{width:11px;height:11px;border-radius:50%;flex:none;display:inline-block}
.leg b{display:block;font-weight:600;font-size:13px}.leg .v{font-size:13px;color:var(--mu)}
.rh{display:flex;justify-content:space-between;align-items:center;margin:10px 2px 6px;flex:none}
.rh b{font-size:15px}.rh button{color:var(--pri);font-weight:600}
.rc{flex:1;min-height:0;overflow:hidden;padding:2px 12px}
@media (max-height:740px){#rec .row:nth-child(n+4){display:none}}
@media (max-height:620px){#rec .row:nth-child(n+3){display:none}}
.row{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.ic{width:36px;height:36px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:17px;flex:none}
.grow{flex:1;min-width:0}.grow b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--mu)}
.amt{font-weight:700;white-space:nowrap}.amt.tr{color:#0b5fd6}
.x{color:var(--mu);font-size:17px;padding:4px 8px}
.empty{color:var(--mu);text-align:center;padding:18px 8px}
.mon{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mon button{font-size:22px;padding:2px 14px;border-radius:10px;background:var(--card)}
.sum{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.sum span{background:var(--card);border-radius:20px;padding:5px 10px;font-size:12.5px}
.tick{width:28px;height:28px;border-radius:50%;border:2px solid var(--mu);display:grid;place-items:center;flex:none;color:transparent;font-weight:800}
.paid .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.paid .grow b{text-decoration:line-through;color:var(--mu)}
.pri{width:100%;background:var(--pri);color:#fff;border-radius:12px;padding:14px;font-weight:700;margin-top:12px}
.ghost{width:100%;border:1.5px dashed var(--pri);border-radius:12px;padding:12px;color:var(--pri);font-weight:600;margin-top:12px}
nav{flex:none;display:flex;justify-content:space-around;align-items:flex-end;background:var(--card);border-top:1px solid var(--bd);padding:6px 10px 8px}
nav .t{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mu);font-size:11px;font-weight:600;width:84px;padding:4px 0}
nav .t.on{color:var(--pri)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav .add{width:56px;height:56px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;margin-top:-28px;border:4px solid var(--bg);box-shadow:0 4px 12px rgba(237,28,36,.4)}
nav .add svg{width:26px;height:26px}
#bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
#bg[hidden]{display:none}
#sheet{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto}
h3{margin:0 0 12px;font-size:18px}
.tabs{display:flex;background:var(--chip);border-radius:12px;padding:3px;margin-bottom:12px}
.tabs button{flex:1;padding:9px;border-radius:10px;font-weight:700;color:var(--mu)}
.tabs button.on{background:var(--card);color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.15)}
input{width:100%;font:inherit;color:var(--tx);background:var(--chip);border:1.5px solid transparent;border-radius:12px;padding:12px;margin-bottom:10px}
input:focus{outline:none;border-color:var(--pri)}
input.big{font-size:28px;font-weight:700}
.lbl{font-size:12.5px;color:var(--mu);margin:4px 0 6px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.chips button{background:var(--chip);border:1.5px solid transparent;border-radius:20px;padding:8px 13px;font-weight:600;display:flex;align-items:center;gap:6px}
.chips button.sel{border-color:var(--pri);background:var(--card);color:var(--pri)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:#1a2233;color:#fff;padding:10px 16px;border-radius:12px;z-index:20;font-weight:600;display:flex;gap:14px;white-space:nowrap}
#toast[hidden]{display:none}#toast button{font-weight:800;text-decoration:underline;color:#ffb3b6}
</style>
</head>
<body>
<header id="hd"></header>
<main id="app"></main>
<nav>
<button class="t" data-a="nav" data-v="list" id="nl"><svg viewBox="0 0 24 24"><path d="M6 4h12v16H6zM9 9h6M9 13h6M9 17h4"/></svg>Spends</button>
<button class="add" data-a="add" aria-label="Add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<button class="t" data-a="nav" data-v="plan" id="np"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/></svg>Planned</button>
</nav>
<div id="bg" hidden><div id="sheet"></div></div>
<div id="toast" hidden></div>
<script>
const MODES={axis:{n:"Axis",c:"#ec4899"},canara:{n:"Canara",c:"#2f7de1"},wallet:{n:"Wallet",c:"#8d5a3b"},kotak:{n:"Kotak",c:"#dc2626"}};
const TYPES=[["Food","🍽️"],["Travel","🚇"],["Bills","🧾"],["Shopping","🛍️"],["Health","💊"],["Fun","🎬"],["Other","✨"]];
const EMO=Object.fromEntries(TYPES),KS=Object.keys(MODES);
let S={bal:{axis:0,canara:0,wallet:0,kotak:0},entries:[],plans:[],last:{type:"Food",mode:"axis"}};
try{const r=localStorage.getItem("mt1");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem("mt1",JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const inr=n=>(n<0?"-":"")+"₹"+Math.abs(n).toLocaleString("en-IN",{maximumFractionDigits:2});
const fk=n=>{const a=Math.abs(n),s=n<0?"-":"";if(a>=1000){const v=Math.floor(a/100)/10;return s+"₹"+(v%1?v.toFixed(1):v)+"k"}return inr(n)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fd=s=>new Date(s+"T00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short"});
const isSp=e=>e.t!=="tr";
let view="home",month=today().slice(0,7),show=false,sel={},sh={},undo=null,tt;
const dp=n=>show?fk(n):"₹ ••••";

const sec=(a0,a1,ro,ri,d)=>{const p=(r,a)=>[100+r*Math.cos(a),100+r*Math.sin(a)],oa=Math.asin(d/ro),ia=Math.asin(d/ri),Lo=(a1-a0-2*oa)>Math.PI?1:0,Li=(a1-a0-2*ia)>Math.PI?1:0;return `M${p(ro,a0+oa)}A${ro} ${ro} 0 ${Lo} 1 ${p(ro,a1-oa)}L${p(ri,a1-ia)}A${ri} ${ri} 0 ${Li} 0 ${p(ri,a0+ia)}Z`};
function donut(){
  const R=72,C=2*Math.PI*R,tot=KS.reduce((a,k)=>a+Math.max(0,S.bal[k]),0),all=KS.reduce((a,k)=>a+S.bal[k],0);
  let a0=-Math.PI/2,arcs=`<circle cx="100" cy="100" r="79" fill="none" stroke="var(--bd)" stroke-width="34"/>`;const pos=KS.filter(k=>S.bal[k]>0),rm=79;
  if(pos.length===1)arcs+=`<circle cx="100" cy="100" r="79" fill="none" stroke="${MODES[pos[0]].c}" stroke-width="34"/>`;else if(tot>0)pos.forEach(k=>{const f=S.bal[k]/tot*2*Math.PI,d=(()=>{let d=6;while(2*Math.asin(d/66)>f*.8)d*=.8;return d})(),c=MODES[k].c;
    arcs+=`<path d="${sec(a0,a0+f,92,66,d)}" fill="${c}" stroke="${c}" stroke-width="8" stroke-linejoin="round"/>`;if(show&&f>.6){const am=a0+f/2;arcs+=`<text x="${100+rm*Math.cos(am)}" y="${100+rm*Math.sin(am)+3}" class="pc">${(f/2/Math.PI*100).toFixed(1)}%</text>`}a0+=f});
  return `<button class="dn" data-a="eye" aria-label="Show or hide balances"><svg class="donut" viewBox="0 0 200 200">${arcs}<text class="ct" x="100" y="104">${dp(all)}</text><text class="cs" x="100" y="122">${show?"tap to hide":"tap to view balance"}</text></svg></button>`;
}
function rowE(e,del){
  const tr=!isSp(e),dot=m=>`<i class="dot" style="width:8px;height:8px;background:${MODES[m].c}"></i>`;
  const ti=tr?`${MODES[e.from].n} → ${MODES[e.to].n}`:(e.note||e.type);
  const sb=tr?`⇄ Self transfer${e.note?" · "+esc(e.note):""} · ${fd(e.date)}`:`${dot(e.mode)} ${MODES[e.mode].n} · ${e.type} · ${fd(e.date)}`;
  return `<div class="row"><div class="ic">${tr?"⇄":EMO[e.type]||"✨"}</div><div class="grow"><b>${esc(ti)}</b><span class="sub">${sb}</span></div><div class="amt ${tr?"tr":""}">${tr?"":"-"}${inr(e.amt)}</div>${del?`<button class="x" data-a="del" data-v="${e.id}" aria-label="Delete">✕</button>`:""}</div>`;
}
const srt=l=>l.sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
function render(){
  const sub=view!=="home";document.body.classList.toggle("sub",sub);
  $("#hd").innerHTML=sub?`<button class="bk" data-a="back" aria-label="Back">←</button><b>${view==="list"?"Spends":"Planned payments"}</b>`:`<div class="lg">₹</div><div><b>Money Tracker</b><small>Axis · Canara · Kotak · Wallet</small></div>`;
  const m=$("#app");m.className=sub?"":"home";let h="";
  if(view==="home"){
    const l=srt([...S.entries]).slice(0,4);
    h=`<div class="card hc">${donut()}<div class="leg">${KS.map(k=>`<button data-a="leg" data-v="${k}"><i class="dot" style="background:${MODES[k].c}"></i><div><b>${MODES[k].n}</b><span class="v">${dp(S.bal[k])}</span></div></button>`).join("")}</div></div>
    <div class="rh"><b>Recent</b><button data-a="nav" data-v="list">See all</button></div>
    <div class="card rc" id="rec">${l.length?l.map(e=>rowE(e)).join(""):`<div class="empty">No entries yet. Tap + to add one.</div>`}</div>`;
  }else if(view==="list"){
    const l=srt(S.entries.filter(e=>e.date.startsWith(month))),sp=l.filter(isSp),tot=sp.reduce((a,e)=>a+e.amt,0),bt={};
    sp.forEach(e=>bt[e.type]=(bt[e.type]||0)+e.amt);
    const label=new Date(month+"-01T00:00").toLocaleDateString("en-IN",{month:"long",year:"numeric"});
    h=`<div class="mon"><button data-a="mon" data-v="-1">‹</button><div style="text-align:center"><b>${label}</b><div class="sub">${fk(tot)} spent</div></div><button data-a="mon" data-v="1">›</button></div>
    <div class="sum">${Object.entries(bt).sort((a,b)=>b[1]-a[1]).map(([t,v])=>`<span>${EMO[t]||""} ${t} ${fk(v)}</span>`).join("")}</div>
    <div class="card">${l.length?l.map(e=>rowE(e,1)).join(""):`<div class="empty">Nothing this month.</div>`}</div>`;
  }else{
    const p=[...S.plans].sort((a,b)=>!!a.entry-!!b.entry),pend=S.plans.filter(x=>!x.entry).reduce((a,x)=>a+x.amt,0);
    h=`<div class="sub">${inr(pend)} still to pay</div><div class="card" style="margin-top:8px">${p.length?p.map(x=>`<div class="row ${x.entry?"paid":""}"><button class="tick" data-a="tog" data-v="${x.id}" aria-label="Mark paid">✓</button><div class="grow"><b>${esc(x.name)}</b><span class="sub"><i class="dot" style="width:8px;height:8px;background:${MODES[x.mode].c}"></i> ${MODES[x.mode].n} · ${x.type}${x.due?" · due "+fd(x.due):""}</span></div><div class="amt">${inr(x.amt)}</div><button class="x" data-a="delplan" data-v="${x.id}" aria-label="Remove">✕</button></div>`).join(""):`<div class="empty">No planned payments yet.</div>`}</div><button class="ghost" data-a="addplan">+ Add planned payment</button>`;
  }
  m.innerHTML=h;
  $("#nl").classList.toggle("on",view==="list");$("#np").classList.toggle("on",view==="plan");
}
const chips=k=>k==="type"?TYPES.map(([t,e])=>`<button data-a="chip" data-k="type" data-v="${t}" class="${sel.type===t?"sel":""}">${e} ${t}</button>`).join(""):KS.map(m=>`<button data-a="chip" data-k="${k}" data-v="${m}" class="${sel[k]===m?"sel":""}"><i class="dot" style="background:${MODES[m].c}"></i>${MODES[m].n}</button>`).join("");
function buildSheet(kind,m){
  sh={kind,m};let h;
  if(kind==="bal")h=`<h3>${MODES[m].n} balance</h3><input id="amt" class="big" inputmode="decimal" placeholder="₹ current balance" value="${S.bal[m]||""}"><button class="pri" data-a="save">Save balance</button>`;
  else if(kind==="plan")h=`<h3>Planned payment</h3><input id="name" placeholder="What for? e.g. Rent, Wi-Fi"><input id="amt" class="big" inputmode="decimal" placeholder="₹ amount"><div class="lbl">Type</div><div class="chips" id="c-type">${chips("type")}</div><div class="lbl">Paid from</div><div class="chips" id="c-mode">${chips("mode")}</div><div class="lbl">Due date (optional)</div><input id="dt" type="date"><button class="pri" data-a="save">Save</button>`;
  else{
    const tabs=`<div class="tabs"><button data-a="tab" data-v="spend" class="${kind==="spend"?"on":""}">Spend</button><button data-a="tab" data-v="transfer" class="${kind==="transfer"?"on":""}">Self transfer</button></div>`;
    h=tabs+`<input id="amt" class="big" inputmode="decimal" placeholder="₹ amount">`+(kind==="spend"?`<div class="lbl">Type</div><div class="chips" id="c-type">${chips("type")}</div><div class="lbl">Paid from</div><div class="chips" id="c-mode">${chips("mode")}</div>`:`<div class="lbl">From</div><div class="chips" id="c-from">${chips("from")}</div><div class="lbl">To</div><div class="chips" id="c-to">${chips("to")}</div>`)+`<input id="note" placeholder="Note (optional)"><div class="lbl">Date</div><input id="dt" type="date" value="${today()}"><button class="pri" data-a="save">${kind==="spend"?"Save spend":"Transfer"}</button>`;
  }
  $("#sheet").innerHTML=h;setTimeout(()=>$(kind==="plan"?"#name":"#amt").focus(),50);
}
function openSheet(kind,m){
  sel={type:S.last.type,mode:S.last.mode,from:S.last.mode,to:KS.find(k=>k!==S.last.mode)};
  buildSheet(kind,m);$("#bg").hidden=false;if(location.hash!=="#sheet")location.hash="sheet";
}
const closeSheet=()=>{if(location.hash==="#sheet")history.back();else $("#bg").hidden=true};
function toast(msg,u){clearTimeout(tt);const t=$("#toast");t.innerHTML=esc(msg)+(u?`<button data-a="undo">Undo</button>`:"");t.hidden=false;tt=setTimeout(()=>t.hidden=true,4500)}
function addEntry(o){const e={id:uid(),...o};S.entries.push(e);S.bal[e.mode]-=e.amt;return e}
function addTr(o){const e={id:uid(),t:"tr",...o};S.entries.push(e);S.bal[e.from]-=e.amt;S.bal[e.to]+=e.amt;return e}
function submit(){
  const amt=parseFloat($("#amt").value),k=sh.kind;
  if(k==="bal"){if(isNaN(amt)){$("#amt").focus();return}S.bal[sh.m]=amt}
  else{
    if(!(amt>0)){$("#amt").focus();return}
    if(k==="plan"){const name=$("#name").value.trim();if(!name){$("#name").focus();return}
      S.plans.push({id:uid(),name,amt,type:sel.type,mode:sel.mode,due:$("#dt").value,entry:null});S.last={type:sel.type,mode:sel.mode}}
    else if(k==="transfer"){addTr({amt,from:sel.from,to:sel.to,note:$("#note").value.trim(),date:$("#dt").value||today()});S.last.mode=sel.from}
    else{addEntry({amt,type:sel.type,mode:sel.mode,note:$("#note").value.trim(),date:$("#dt").value||today()});S.last={type:sel.type,mode:sel.mode}}
  }
  save();render();closeSheet();
}
function togglePlan(id){
  const p=S.plans.find(x=>x.id===id);if(!p)return;
  if(p.entry){const e=S.entries.find(x=>x.id===p.entry);if(e){S.bal[e.mode]+=e.amt;S.entries=S.entries.filter(x=>x!==e)}p.entry=null;toast("Marked unpaid, spend removed")}
  else{p.entry=addEntry({amt:p.amt,type:p.type,mode:p.mode,note:p.name,date:today(),plan:p.id}).id;toast("Paid, added to your spends")}
  save();render();
}
function delEntry(id){
  const e=S.entries.find(x=>x.id===id);if(!e)return;
  const tr=!isSp(e),f=(s)=>{if(tr){S.bal[e.from]+=s*e.amt;S.bal[e.to]-=s*e.amt}else S.bal[e.mode]+=s*e.amt};
  S.entries=S.entries.filter(x=>x!==e);f(1);
  const p=S.plans.find(x=>x.entry===id);if(p)p.entry=null;
  undo=()=>{S.entries.push(e);f(-1);if(p)p.entry=id};
  save();render();toast("Entry deleted",true);
}
function go(v){if(view===v){history.back();return}if(view==="home")location.hash=v;else location.replace("#"+v)}
function route(){const h=location.hash.slice(1);if(h==="sheet")return;$("#bg").hidden=true;view=(h==="list"||h==="plan")?h:"home";render()}
addEventListener("hashchange",route);
document.addEventListener("click",ev=>{
  if(ev.target.id==="bg"){closeSheet();return}
  const t=ev.target.closest("[data-a]");if(!t)return;
  const a=t.dataset.a,v=t.dataset.v;
  if(a==="nav")go(v);
  else if(a==="back")history.length>1?history.back():location.replace("#");
  else if(a==="eye"){show=!show;render()}
  else if(a==="leg"){if(!show){show=true;render()}else openSheet("bal",v)}
  else if(a==="add")openSheet("spend");
  else if(a==="addplan")openSheet("plan");
  else if(a==="tab"){const x=$("#amt").value;buildSheet(v);$("#amt").value=x}
  else if(a==="chip"){const k=t.dataset.k;sel[k]=v;const o=k==="from"?"to":k==="to"?"from":0;if(o&&sel[o]===v)sel[o]=KS.find(x=>x!==v);
    ["type","mode","from","to"].forEach(x=>{const el=$("#c-"+x);if(el)el.innerHTML=chips(x)})}
  else if(a==="save")submit();
  else if(a==="tog")togglePlan(v);
  else if(a==="del")delEntry(v);
  else if(a==="delplan"){S.plans=S.plans.filter(x=>x.id!==v);save();render()}
  else if(a==="mon"){const d=new Date(month+"-01T00:00");d.setMonth(d.getMonth()+ +v);month=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");render()}
  else if(a==="undo"){if(undo){undo();undo=null;save();render()}$("#toast").hidden=true}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&!$("#bg").hidden&&e.target.tagName==="INPUT")submit()});
if(location.hash==="#sheet")location.replace("#");
route();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
